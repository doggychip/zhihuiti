simulation:
  ticks: 100
  seed: 42
  log_interval: 10

realms:
  compute:
    capacity: 50
    base_reward: 10
    difficulty_growth: 0.02
  memory:
    capacity: 40
    base_reward: 8
    decay_rate: 0.01
  network:
    capacity: 30
    base_reward: 12
    routing_fee: 0.05
  information:
    capacity: 35
    base_reward: 9
    base_noise: 0.5

economy:
  initial_supply: 10000
  mint_rate: 50
  stake_min: 10
  stake_reward_rate: 0.03
  transfer_fee: 0.01

agents:
  initial_count: 30

# Hermes Agent backend (NousResearch/hermes-agent)
# Enable: set HERMES_ENABLED=1 and install hermes-agent
hermes:
  enabled: false  # Override with HERMES_ENABLED=1 env var
  model: "deepseek/deepseek-chat"  # Override with HERMES_MODEL env var
  max_iterations: 30
  # Per-role toolset mapping (what tools each agent type can use)
  toolsets:
    researcher: [web, file]
    analyst: [web, file, terminal]
    coder: [file, terminal]
    trader: [web, terminal]
    alphaarena_trader: [web, terminal]
    coordinator: [file, memory]
    auditor: [file]
    strategist: [web, file]
    causal_reasoner: [web, file]
    judge: []
    custom: [web, file]
