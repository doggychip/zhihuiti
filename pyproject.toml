[project]
name = "zhihuiti"
version = "0.1.0"
description = "智慧体 — Autonomous multi-agent orchestration system with Silicon Realms simulator"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "discord.py>=2.3",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
    "flask>=3.1",
    "flask-cors>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhihuiti*", "silicon_realms*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
trading = ["ccxt>=4.0", "freqtrade>=2024.1"]
observability = ["langfuse>=2.0", "arize-phoenix>=4.0", "openlit>=1.0"]
memory = ["chromadb>=0.5", "mem0ai>=0.1", "mempalace>=0.1"]
knowledge = ["graphrag>=0.3"]
evolution = ["evotorch>=0.5"]
rl = ["pettingzoo>=1.24"]
simulation = ["mesa>=3.0"]
workflow = ["temporalio>=1.7"]
benchmark = ["swebench>=2.0"]
interop = ["python-a2a>=0.1"]
all = [
    "zhihuiti[trading,observability,memory,knowledge,evolution,rl,simulation,workflow,benchmark,interop]",
]

[project.scripts]
zhihuiti = "zhihuiti.cli:main"
silicon-realms = "silicon_realms.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
