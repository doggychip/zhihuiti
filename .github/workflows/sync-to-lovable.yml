name: Sync frontend to Lovable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'components.json'
      - 'package.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zhihuiti
        uses: actions/checkout@v4
        with:
          path: zhihuiti

      - name: Checkout Lovable repo
        uses: actions/checkout@v4
        with:
          repository: doggychip/zhihuiti-357e516b
          token: ${{ secrets.LOVABLE_SYNC_TOKEN }}
          path: lovable

      - name: Sync frontend code
        run: |
          cd lovable

          # Remove old source dirs
          rm -rf src shared index.html tailwind.config.ts postcss.config.js components.json vite.config.ts tsconfig.json tsconfig.app.json

          # Copy frontend source
          cp -r ../zhihuiti/client/src ./src
          cp ../zhihuiti/client/index.html ./index.html

          # Copy shared types (needed for @shared imports)
          cp -r ../zhihuiti/shared ./shared

          # Copy configs
          cp ../zhihuiti/tailwind.config.ts ./tailwind.config.ts
          cp ../zhihuiti/postcss.config.js ./postcss.config.js
          cp ../zhihuiti/components.json ./components.json

          # Create Lovable-compatible vite.config.ts (paths adjusted for flat structure)
          cat > vite.config.ts << 'VITE_EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import path from "path";
          import { fileURLToPath } from "url";

          const __dirname = path.dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            plugins: [react()],
            resolve: {
              alias: {
                "@": path.resolve(__dirname, "src"),
                "@shared": path.resolve(__dirname, "shared"),
              },
            },
            base: "./",
            build: {
              outDir: "dist",
              emptyOutDir: true,
            },
          });
          VITE_EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' vite.config.ts

          # Create Lovable-compatible tsconfig.json
          cat > tsconfig.json << 'TS_EOF'
          {
            "include": ["src/**/*", "shared/**/*"],
            "exclude": ["node_modules", "dist"],
            "compilerOptions": {
              "noEmit": true,
              "module": "ESNext",
              "strict": true,
              "lib": ["esnext", "dom", "dom.iterable"],
              "jsx": "react-jsx",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "allowImportingTsExtensions": true,
              "moduleResolution": "bundler",
              "baseUrl": ".",
              "types": ["node", "vite/client"],
              "paths": {
                "@/*": ["./src/*"],
                "@shared/*": ["./shared/*"]
              }
            }
          }
          TS_EOF
          sed -i 's/^          //' tsconfig.json

          # Create frontend-only package.json (no server deps)
          cat > package.json << 'PKG_EOF'
          {
            "name": "zhihuiti-dashboard",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@hookform/resolvers": "^3.10.0",
              "@radix-ui/react-accordion": "^1.2.4",
              "@radix-ui/react-alert-dialog": "^1.1.7",
              "@radix-ui/react-aspect-ratio": "^1.1.3",
              "@radix-ui/react-avatar": "^1.1.4",
              "@radix-ui/react-checkbox": "^1.1.5",
              "@radix-ui/react-collapsible": "^1.1.4",
              "@radix-ui/react-context-menu": "^2.2.7",
              "@radix-ui/react-dialog": "^1.1.7",
              "@radix-ui/react-dropdown-menu": "^2.1.7",
              "@radix-ui/react-hover-card": "^1.1.7",
              "@radix-ui/react-label": "^2.1.3",
              "@radix-ui/react-menubar": "^1.1.7",
              "@radix-ui/react-navigation-menu": "^1.2.6",
              "@radix-ui/react-popover": "^1.1.7",
              "@radix-ui/react-progress": "^1.1.3",
              "@radix-ui/react-radio-group": "^1.2.4",
              "@radix-ui/react-scroll-area": "^1.2.4",
              "@radix-ui/react-select": "^2.1.7",
              "@radix-ui/react-separator": "^1.1.3",
              "@radix-ui/react-slider": "^1.2.4",
              "@radix-ui/react-slot": "^1.2.0",
              "@radix-ui/react-switch": "^1.1.4",
              "@radix-ui/react-tabs": "^1.1.4",
              "@radix-ui/react-toast": "^1.2.7",
              "@radix-ui/react-toggle": "^1.1.3",
              "@radix-ui/react-toggle-group": "^1.1.3",
              "@radix-ui/react-tooltip": "^1.2.0",
              "@tanstack/react-query": "^5.60.5",
              "class-variance-authority": "^0.7.1",
              "clsx": "^2.1.1",
              "cmdk": "^1.1.1",
              "date-fns": "^3.6.0",
              "drizzle-orm": "^0.39.3",
              "drizzle-zod": "^0.7.0",
              "embla-carousel-react": "^8.6.0",
              "input-otp": "^1.4.2",
              "lucide-react": "^0.453.0",
              "react": "^18.3.1",
              "react-day-picker": "^8.10.1",
              "react-dom": "^18.3.1",
              "react-hook-form": "^7.55.0",
              "react-resizable-panels": "^2.1.7",
              "recharts": "^2.15.2",
              "tailwind-merge": "^2.6.0",
              "tailwindcss-animate": "^1.0.7",
              "vaul": "^1.1.2",
              "wouter": "^3.3.5",
              "zod": "^3.24.2"
            },
            "devDependencies": {
              "@tailwindcss/typography": "^0.5.15",
              "@types/node": "20.19.27",
              "@types/react": "^18.3.11",
              "@types/react-dom": "^18.3.1",
              "@vitejs/plugin-react": "^4.7.0",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.47",
              "tailwindcss": "^3.4.17",
              "typescript": "5.6.3",
              "vite": "^7.3.0"
            }
          }
          PKG_EOF
          sed -i 's/^          //' package.json

          # Fix paths in tailwind config and components.json
          sed -i 's|./client/index.html|./index.html|g' tailwind.config.ts
          sed -i 's|./client/src|./src|g' tailwind.config.ts
          sed -i 's|client/src/index.css|src/index.css|g' components.json

      - name: Commit and push
        run: |
          cd lovable
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync: auto-import from zhihuiti $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
