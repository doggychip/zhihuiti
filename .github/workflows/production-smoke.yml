name: Production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Create a test alert issue even when production is healthy
        required: false
        default: false
        type: boolean

jobs:
  verify-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deployed runtime
        id: smoke
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/production_smoke.py \
              --expected-commit "$GITHUB_SHA" \
              --expected-instance-id "${{ vars.ZHIHUITI_EXPECTED_INSTANCE_ID }}" \
              --timeout 600 | tee production-smoke.json
          else
            python scripts/production_smoke.py \
              --expected-instance-id "${{ vars.ZHIHUITI_EXPECTED_INSTANCE_ID }}" \
              | tee production-smoke.json
          fi

      - name: Publish production alert
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          FORCE_ALERT: ${{ inputs.test_alert || false }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Zhihuiti] Production health alert';
            const forced = process.env.FORCE_ALERT === 'true';
            const failed = process.env.SMOKE_OUTCOME === 'failure' || forced;
            const report = fs.existsSync('production-smoke.json')
              ? fs.readFileSync('production-smoke.json', 'utf8').trim()
              : '{"ok":false,"error":"health report was not produced"}';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (failed) {
              const body = [
                forced
                  ? 'This is a requested test of the production alert channel.'
                  : 'The automated production monitor detected a failure.',
                '',
                `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '```json',
                report.slice(0, 12000),
                '```',
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Production checks recovered. Closing this alert automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail unhealthy monitor run
        if: steps.smoke.outcome == 'failure'
        run: exit 1
